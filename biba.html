<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>BIBA — l'assistante de KHALAM</title>
<meta name="theme-color" content="#0B1020">
<style>
  :root { --or:#C9A227; --nuit:#0B1020; --creme:#FFF7DC; --rouge:#ef4444; --bleu:#3b82f6; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { margin:0; background:var(--nuit); color:var(--creme); display:flex; flex-direction:column;
         font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 22px); }
  main { max-width:560px; width:100%; margin:0 auto; flex:1; display:flex; flex-direction:column; }

  header { text-align:center; flex:0 0 auto; }
  .marque { font-size:12px; letter-spacing:4px; opacity:.45; }
  h1 { font-size:26px; margin:6px 0 2px; color:var(--or); letter-spacing:1px; }
  .role { font-size:13px; opacity:.55; margin:0; }

  .scene { flex:1; display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:16px; text-align:center; min-height:0; padding:18px 0; }
  .dit { font-size:14px; font-style:italic; opacity:.5; min-height:1.4em; }
  .reponse { font-size:21px; line-height:1.45; }
  .reponse-fr { font-size:14px; opacity:.55; margin-top:8px; }
  .qui { font-size:12px; letter-spacing:1.5px; text-transform:uppercase; opacity:.45; }

  .commande { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .micro { width:clamp(96px,26vw,124px); height:clamp(96px,26vw,124px); border:0; border-radius:50%;
           background:var(--bleu); color:#fff; display:grid; place-items:center; cursor:pointer;
           transition:transform .12s ease, background .12s ease; touch-action:none;
           -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .micro svg { width:42%; height:42%; fill:currentColor; }
  .etat { display:flex; align-items:center; justify-content:center; gap:8px;
          font-size:14px; opacity:.75; min-height:1.5em; }

  .balance { display:none; color:var(--or); line-height:0; }
  .balance[data-actif="oui"] { display:inline-flex; }
  .balance .fleau { transform-box:view-box; transform-origin:16px 11px;
                    animation:peser 1.9s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes peser { 0%,100% { transform:rotate(-12deg); } 50% { transform:rotate(12deg); } }
  @media (prefers-reduced-motion: reduce) { .balance .fleau { animation:none; } }

  button.plat { background:transparent; border:1px solid rgba(255,247,220,.25); color:var(--creme);
                border-radius:99px; padding:9px 16px; font:inherit; font-size:13px; cursor:pointer; }
  input, textarea { font:inherit; width:100%; padding:13px 14px; border-radius:12px; color:var(--creme);
                    border:1px solid rgba(255,247,220,.18); background:rgba(255,255,255,.05); }
  .boite { background:rgba(255,255,255,.05); border-radius:16px; padding:16px; margin-top:14px; text-align:left; }
  .boite h2 { font-size:14px; margin:0 0 10px; opacity:.7; font-weight:600; }
  .plein { width:100%; background:var(--or); color:#1a1405; border:0; border-radius:12px;
           padding:14px; font:inherit; font-weight:700; margin-top:10px; cursor:pointer; }
  .erreur { color:#ff9d9d; }

  #verrou { position:fixed; inset:0; z-index:20; background:var(--nuit); display:flex;
            align-items:center; justify-content:center; padding:24px; }
  #verrou .dedans { max-width:400px; width:100%; text-align:center; }
</style>
</head>
<body>

<div id="verrou">
  <div class="dedans">
    <div class="marque">K H A L A M</div>
    <h1>BIBA</h1>
    <p class="role" style="margin-bottom:22px">Tape le code que KHALAM t'a envoyé.</p>
    <input id="code" type="text" autocomplete="off" autocapitalize="characters"
           placeholder="AWA-N8YT-K89YZ" style="text-align:center; letter-spacing:1px">
    <button class="plein" id="entrer">Entrer</button>
    <p id="verrou-erreur" class="erreur" style="font-size:14px" hidden></p>
  </div>
</div>

<main hidden id="appli">
  <header>
    <div class="marque">K H A L A M</div>
    <h1>BIBA</h1>
    <p class="role">Assistante virtuelle</p>
  </header>

  <div class="scene">
    <div class="qui" id="qui" hidden></div>
    <div class="dit" id="entendu"></div>
    <div>
      <div class="reponse" id="reponse">Appuie sur le micro et parle.</div>
      <div class="reponse-fr" id="reponse-fr"></div>
    <!-- Le chronomètre. Discret, mais il met fin aux impressions : on ne
         discute plus de « c'est lent », on lit où part le temps. -->
    <div id="chrono" style="font-size:11px;opacity:.35;margin-top:10px;letter-spacing:.4px"></div>
    </div>
    <button class="plat" id="mal" hidden>Mal traduit</button>
    <div class="boite" id="correction" hidden>
      <h2>Comment fallait-il le dire ?</h2>
      <textarea id="juste" rows="3"></textarea>
      <button class="plein" id="envoyer">Envoyer la correction</button>
    </div>
  </div>

  <div class="commande">
    <button class="micro" id="micro" aria-label="Parler à BIBA">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21h-2a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.08A7 7 0 0 0 19 11z"/></svg>
    </button>
    <div class="etat">
      <span class="balance" id="pense" hidden aria-hidden="true">
        <svg viewBox="0 0 32 32" width="20" height="20" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 8v17"/><path d="M10 25.5h12"/>
          <g class="fleau">
            <path d="M5 11h22"/>
            <path d="M5 11l-3.2 5.2h6.4z" fill="currentColor" stroke-width="1.6"/>
            <path d="M27 11l-3.2 5.2h6.4z" fill="currentColor" stroke-width="1.6"/>
          </g>
        </svg>
      </span>
      <span id="etat">Appuie pour parler</span>
    </div>
  </div>
</main>

<audio id="son" playsinline></audio>

<script>
/* Cette page est servie depuis une adresse de KHALAM ; le serveur est
   ailleurs, l'adresse d'appel doit donc être entière. Le serveur autorise
   expressément cette origine — sans quoi le navigateur bloquerait l'appel
   avant même qu'il parte. NE PAS recopier ce fichier à la main : passer par
   outils-copie-site.mjs, sinon l'adresse redevient relative et la page meurt
   en silence. */
const SERVEUR = 'https://interprete-wolof.onrender.com';
const $ = (id) => document.getElementById(id);

let code = '';
try { code = localStorage.getItem('biba.code') || ''; } catch {}

async function appel(chemin, corps) {
  const r = await fetch(SERVEUR + chemin, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-code-acces': code },
    body: JSON.stringify(corps),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (j.etat === 'code_expire' || j.etat === 'code_epuise' || j.etat === 'trop_d_essais') {
      throw new Error(j.erreur);
    }
    throw new Error(j.erreur || `Le service a répondu ${r.status}`);
  }
  return j;
}

/* ── L'état affiché ───────────────────────────────────────────────────── */
function etat(texte, pense = false) {
  $('etat').textContent = texte;
  $('pense').hidden = !pense;
  $('pense').dataset.actif = pense ? 'oui' : 'non';
}

/* ── « J'ai compris, je prépare » ──────────────────────────────────────────
   Entre le moment où l'on se tait et celui où BIBA parle, il reste des
   secondes. Elles paraissent bien plus longues quand rien ne bouge : on croit
   que ça a planté, on réappuie, on repart de zéro.

   Deux notes courtes, fabriquées par le téléphone lui-même — pas de fichier à
   télécharger, pas d'aller-retour, quelques millisecondes. Elles disent
   exactement une chose : « ta question est prise ». Le reste de l'attente est
   la même, mais on sait qu'elle sert à quelque chose.

   Le son n'est jamais indispensable : s'il échoue, la balance qui pense reste
   à l'écran, et rien ne casse. */
let sonnerie = null;

function bipCompris() {
  try {
    const Contexte = window.AudioContext || window.webkitAudioContext;
    if (!Contexte) return;
    sonnerie = sonnerie || new Contexte();
    if (sonnerie.state === 'suspended') sonnerie.resume();
    const t = sonnerie.currentTime;
    // Deux notes qui montent : on entend « reçu », pas « erreur ».
    [[880, 0], [1174, 0.09]].forEach(([frequence, decalage]) => {
      const o = sonnerie.createOscillator();
      const g = sonnerie.createGain();
      o.type = 'sine';
      o.frequency.value = frequence;
      g.gain.setValueAtTime(0.0001, t + decalage);
      g.gain.exponentialRampToValueAtTime(0.12, t + decalage + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decalage + 0.085);
      o.connect(g).connect(sonnerie.destination);
      o.start(t + decalage);
      o.stop(t + decalage + 0.1);
    });
  } catch { /* sans le bip, la balance suffit */ }
}

/* ── La conversation ──────────────────────────────────────────────────── */
const FIN_CONVERSATION_MS = 30000;
let phrases = {};
let attendLeNom = false;
let nomActuel = '';
let questionEnAttente = '';
/* La langue de celui qui parle, retenue dès sa première phrase.

   LE FRANÇAIS EST LE DÉFAUT, et le doute lui revient. Décidé avec Lamine :
   son wolof n'est pas encore entièrement relu, et BIBA peut s'y tromper. Une
   réponse française à quelqu'un qui parle wolof se comprend ; du wolof
   approximatif à quelqu'un qui n'en attendait pas, non. Le wolof ne sort que
   lorsqu'on en est sûr. */
let langueConversation = '';
let dernier = null;
let minuteurFin = null;
const motsDe = (t) => String(t || '').trim().split(/\s+/).filter(Boolean).length;

function relancer() { clearTimeout(minuteurFin); minuteurFin = setTimeout(finir, FIN_CONVERSATION_MS); }
function suspendre() { clearTimeout(minuteurFin); }
function finir() {
  suspendre();
  nomActuel = ''; attendLeNom = false; questionEnAttente = ''; dernier = null;
  $('qui').hidden = true;
  $('mal').hidden = true; $('correction').hidden = true;
  $('entendu').textContent = '';
  $('reponse').textContent = 'Appuie sur le micro et parle.';
  $('reponse-fr').textContent = '';
  etat('Appuie pour parler');
}

function phrase(cle, nom) {
  const p = phrases[cle] || {};
  // Le wolof, seulement si on est sûr que c'est la langue de la personne.
  const wo = langueConversation === 'wo' ? (p.wo || '').trim() : '';
  const texte = wo || p.fr || '';
  return { texte: texte.replace('{nom}', nom || ''), langue: wo ? 'wo' : 'fr',
           fr: (p.fr || '').replace('{nom}', nom || '') };
}

async function direPhrase(cle, nom) {
  const p = phrase(cle, nom);
  if (!p.texte) return;
  $('reponse').textContent = p.texte;
  $('reponse-fr').textContent = (p.langue === 'wo' && p.fr !== p.texte) ? p.fr : '';
  await direAVoixHaute(p.texte, p.langue);
}

/* Ce que BIBA doit DIRE, pas seulement afficher.

   « Tu as utilisé tes 15 questions » écrit sur un écran ne sert à rien à
   quelqu'un qui ne lit pas — et c'est précisément pour ces gens-là que cette
   application existe. Toujours en français : c'est un message de KHALAM, pas
   une réponse à une question, et le wolof n'est pas encore relu. */
async function annoncer(message) {
  etat(message);
  $('reponse').textContent = message;
  $('reponse-fr').textContent = '';
  await direAVoixHaute(message, 'fr');
}

/* ── Parler vite ───────────────────────────────────────────────────────────
   Mesuré depuis Dakar, sur le vrai serveur : la voix coûte environ deux
   secondes fixes, plus 36 millisecondes par caractère. Une réponse de 271
   caractères mettait donc douze secondes à se fabriquer — et pendant ces
   douze secondes, rien. Ni son, ni texte.

   Deux corrections, ici :

   1. On ne demande plus la voix en même temps que la réponse. Le texte
      s'affiche dès qu'il est écrit (deux secondes et demie), au lieu
      d'attendre que tout l'audio soit prêt (neuf secondes).

   2. On coupe la réponse à la première phrase. Les deux morceaux partent
      ENSEMBLE ; le premier revient plus vite parce qu'il est plus court, et
      BIBA commence à parler pendant que la suite se fabrique encore. Le
      second est prêt bien avant que le premier ait fini d'être dit.

   C'est la différence entre attendre douze secondes en silence et entendre
   une voix au bout de quatre. */
function couperEnDeux(texte, seuil = 110) {
  const t = (texte || '').trim();
  if (t.length <= seuil) return [t, ''];
  const fins = [];
  const r = /[.!?…]\s+/g;
  let m;
  while ((m = r.exec(t))) fins.push(m.index + m[0].length);
  // La coupure la plus proche du seuil, sans jamais laisser un bout ridicule.
  const bonne = fins.find((i) => i >= 40);
  if (bonne && bonne < t.length - 10) return [t.slice(0, bonne).trim(), t.slice(bonne).trim()];
  return [t, ''];
}

/* La voix déjà fabriquée se prend par son nom, en GET.
   Un POST ne se met pas en cache ; un fichier, si. La deuxième fois qu'on
   pose la même question, l'audio ne quitte plus le téléphone : il est dans
   le cache du navigateur, marqué immuable pour un an. C'est ce qui fait la
   différence entre « rapide » et « instantané ». */
async function voixDejaPrete(clef) {
  if (!clef) return null;
  try {
    const r = await fetch(`${SERVEUR}/api/voix-prete/${clef}`, { headers: { 'x-code-acces': code } });
    if (!r.ok) return null;                      // pas encore fabriquée : chemin normal
    const blob = await r.blob();
    return { url: URL.createObjectURL(blob) };
  } catch { return null; }
}

async function jouerMorceau(r) {
  if (!r || !r.audio_base64) return false;
  const son = $('son');
  son.src = `data:${r.type_mime || 'audio/mp4'};base64,${r.audio_base64}`;
  await jouerEtAttendre(son);
  return true;
}

async function direVite(texte, langue, clefPrete) {
  if (!texte) return;

  /* Le circuit court : la phrase entière est déjà en voix sur le serveur.
     Rien à fabriquer, rien à découper — on lit un fichier. */
  const prete = await voixDejaPrete(clefPrete);
  if (prete) {
    const son = $('son');
    son.src = prete.url;
    try { await jouerEtAttendre(son); } finally { URL.revokeObjectURL(prete.url); }
    return;
  }

  const [debut, reste] = couperEnDeux(texte);
  // Les deux partent en même temps. Rien n'attend son tour pour être demandé.
  const promesseReste = reste
    ? appel('/api/voix', { texte: reste, langue, voix: 'femme' }).catch(() => null)
    : null;
  try {
    const premier = await appel('/api/voix', { texte: debut, langue, voix: 'femme' });
    if (!(await jouerMorceau(premier))) {
      etat('La voix n’a rien renvoyé — le texte est à l’écran');
    }
  } catch (e) {
    etat(`Sans la voix : ${e.message}`);
  }
  if (promesseReste) await jouerMorceau(await promesseReste);
}

/* Une voix qui échoue ne doit pas se taire en silence : le texte reste à
   l'écran et on croit que c'est normal. On le dit. */
async function direAVoixHaute(texte, langue) {
  if (!texte) return;
  try {
    const r = await appel('/api/voix', { texte, langue, voix: 'femme' });
    if (!r.audio_base64) { etat('La voix n’a rien renvoyé — le texte est à l’écran'); return; }
    const son = $('son');
    son.src = `data:${r.type_mime || 'audio/mp4'};base64,${r.audio_base64}`;
    await jouerEtAttendre(son);
  } catch (e) {
    etat(`Sans la voix : ${e.message}`);
  }
}

/* ── Obtenir le droit de parler ────────────────────────────────────────────
   L'iPhone refuse de jouer un son qui n'a pas été déclenché DIRECTEMENT par un
   doigt. Or entre l'appui et la voix de BIBA il y a trois attentes : le micro
   s'ouvre, la transcription part et revient, puis on va chercher la voix. Le
   temps que tout ça revienne, Safari considère que le geste est terminé et
   refuse — sans erreur, sans rien à l'écran. On croit BIBA muette.

   On prend donc la permission d'avance : au tout premier contact du doigt sur
   la page, on lance un son vide et on l'arrête aussitôt. Ça ne s'entend pas,
   et tout ce qui suit passe. */
const SILENCE = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
let audioDebloque = false;

function debloquerAudio() {
  if (audioDebloque) return;
  const son = $('son');
  son.src = SILENCE;
  son.play().then(() => { audioDebloque = true; son.pause(); })
            .catch(() => { /* réessai au prochain contact */ });
}
document.addEventListener('pointerdown', debloquerAudio);
document.addEventListener('touchstart', debloquerAudio, { passive: true });

/* ── La parole de BIBA, qu'on peut couper ─────────────────────────────── */
let enTrainDeParler = false;
let finDeParole = null;

function arreterLaParole() {
  if (!enTrainDeParler) return;
  const son = $('son');
  son.pause();
  try { son.currentTime = 0; } catch {}
  if (finDeParole) finDeParole();
}

function jouerEtAttendre(son) {
  return new Promise((fini) => {
    let rendu = false;
    const rendre = () => {
      if (rendu) return;
      rendu = true; enTrainDeParler = false; finDeParole = null; fini();
    };
    enTrainDeParler = true; finDeParole = rendre;
    son.onended = rendre; son.onerror = rendre;
    setTimeout(rendre, 45000);
    son.play().catch(rendre);
  });
}

/* ── Le micro ─────────────────────────────────────────────────────────── */
/* Deux secondes de silence avant de conclure, c'était deux secondes perdues
   sur CHAQUE question — plus que la réflexion de BIBA elle-même.

   Mais on ne peut pas simplement couper court : quelqu'un qui cherche ses mots
   se ferait interrompre, et Lamine me l'a déjà reproché à juste titre. Alors
   le délai dépend de ce que le navigateur SAIT :

   - il annonce lui-même que la voix s'est arrêtée (« speechend ») : il en est
     sûr, on conclut en 600 ms ;
   - il ne dit rien et on ne compte que les mots : on garde le filet large,
     parce qu'un silence entre deux mots n'est pas une fin de phrase ;
   - la personne n'a dit qu'un mot ou deux : on attend plus longtemps. « Euh…
     Khalam… » n'est pas une question finie. */
const SILENCE_MS = 600;
const SILENCE_DEBUT_MS = 1400;   // tant qu'on n'a presque rien entendu
const MOTS_POUR_ETRE_SUR = 3;
/* Le chemin de secours, lui, écoute le SON et non les mots : un silence
   mesuré au micro est une preuve, pas une supposition. On peut donc conclure
   vite — un peu plus prudemment quand même, car ici rien ne se réaffiche à
   l'écran pendant qu'on parle. */
const SILENCE_SON_MS = 900;
let enregistreur = null;
let flux = null;

function micActif(actif) {
  const b = $('micro');
  b.style.background = actif ? 'var(--rouge)' : 'var(--bleu)';
  b.style.transform = actif ? 'scale(1.06)' : 'scale(1)';
  if (!actif) b.style.boxShadow = 'none';
}

/* Trois filets indépendants, parce que sur iPhone l'analyse du son peut ne
   jamais démarrer : le silence, le « on n'a rien dit », et une horloge qui ne
   dépend d'aucun son. Sans le dernier, le micro resterait ouvert sans fin. */
function surveiller(fluxAudio, arreter, rapport) {
  const SANS_UN_MOT_MS = 2000;   // appuyé, et pas un son : on referme
  const DUREE_MAX = 30000;
  const bouton = $('micro');
  let termine = false, horloge = null, boucle = null, ctx = null;

  const conclure = () => {
    if (termine) return;
    termine = true;
    clearInterval(boucle); clearTimeout(horloge);
    micActif(false);
    if (ctx) ctx.close().catch(() => {});
  };
  const fermer = () => { conclure(); arreter(); };
  horloge = setTimeout(fermer, DUREE_MAX);

  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const analyse = ctx.createAnalyser();
    analyse.fftSize = 1024;
    ctx.createMediaStreamSource(fluxAudio).connect(analyse);
    const donnees = new Uint8Array(analyse.fftSize);

    let fond = 0, mesures = 0, aParle = false;
    let debutSilence = 0, debutParole = 0, dernierTour = Date.now();
    const DEBUT = Date.now(), CALIBRATION_MS = 500, PAROLE_MINIMALE = 1000;

    const niveau = () => {
      analyse.getByteTimeDomainData(donnees);
      let s = 0;
      for (let i = 0; i < donnees.length; i += 1) { const v = (donnees[i] - 128) / 128; s += v * v; }
      return Math.sqrt(s / donnees.length);
    };

    boucle = setInterval(() => {
      if (termine) return;
      if (!enregistreur || enregistreur.state !== 'recording') { conclure(); return; }
      const n = niveau();
      const ecoule = Date.now() - DEBUT;
      if (ecoule < CALIBRATION_MS) { fond += n; mesures += 1; return; }

      rapport.analyse = true;
      const ecartTour = Math.min(Date.now() - dernierTour, 150);
      dernierTour = Date.now();
      const seuil = Math.max((mesures ? fond / mesures : 0.01) * 2.2, 0.02);

      const ampleur = Math.min(1, n / (seuil * 3));
      bouton.style.boxShadow = n > seuil
        ? `0 0 0 ${Math.round(6 + ampleur * 18)}px rgba(239,68,68,${0.28 - ampleur * 0.16})` : 'none';

      if (n > seuil) {
        if (!aParle) debutParole = Date.now();
        aParle = true; debutSilence = 0; rapport.parole += ecartTour;
        return;
      }
      if (!aParle) { if (ecoule > SANS_UN_MOT_MS) fermer(); return; }
      if (Date.now() - debutParole <= PAROLE_MINIMALE) return;
      if (!debutSilence) debutSilence = Date.now();
      else if (Date.now() - debutSilence > SILENCE_SON_MS) fermer();
    }, 100);
  } catch { /* il reste l'horloge et le second appui */ }

  return conclure;
}

function format() {
  if (typeof MediaRecorder === 'undefined') return null;
  for (const t of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']) {
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}
const EXT = { 'audio/mp4':'m4a', 'audio/webm':'webm', 'audio/ogg':'ogg' };

/* ── Le téléphone écrit pendant qu'on parle ────────────────────────────────
   Le chemin normal envoie l'enregistrement entier à un service qui le
   transcrit : deux à quatre secondes après qu'on a fini de parler. Le
   téléphone, lui, sait reconnaître le français TOUT SEUL, pendant qu'on parle.
   Quand on se tait, le texte est déjà écrit — et les mots s'affichent au fur
   et à mesure, ce qui change tout : on voit que ça marche.

   Le wolof n'est pas concerné : aucun navigateur ne le reconnaît. Il garde le
   chemin d'avant, inchangé.

   Trois filets, parce que ce mécanisme est capricieux :
   - il n'existe pas partout → on retombe sur l'enregistrement ;
   - il peut refuser en cours de route → on retombe aussi ;
   - il n'a rien entendu → on le dit, comme avant. */
const RecoNavigateur = window.SpeechRecognition || window.webkitSpeechRecognition;
let recoEnCours = null;
/* Un téléphone qui annonce savoir reconnaître le français mais ne rend jamais
   rien : ça existe. Après un échec, on ne réessaie plus de la séance — on
   reprend l'enregistrement, qui marche partout. */
let telephoneEcouteMal = false;

function ecouterAvecLeTelephone() {
  const reco = new RecoNavigateur();
  recoEnCours = reco;
  reco.lang = 'fr-FR';
  reco.maxAlternatives = 1;
  /* Sans « continuous », le navigateur coupe à la première respiration : une
     phrase de deux secondes suffit à le faire abandonner. On garde la main. */
  reco.continuous = true;
  reco.interimResults = true;

  let acquis = '';          // ce que le navigateur a arrêté définitivement
  let provisoireCourant = ''; // ce qu'il est en train de reconnaître
  let minuterie = null;
  let fini = false;

  const conclure = () => {
    if (fini) return;
    fini = true;
    clearTimeout(minuterie);
    try { reco.stop(); } catch { /* déjà arrêté */ }
    micActif(false);
    recoEnCours = null;

    /* ON GARDE CE QUI EST À L'ÉCRAN. Le navigateur distingue ce qu'il a
       définitivement arrêté et ce qu'il est encore en train de reconnaître.
       Je ne prenais que le premier — et comme on conclut dès que la voix
       s'arrête, le définitif n'était souvent pas encore arrivé : on jetait
       les mots qu'on venait d'afficher, et BIBA disait n'avoir rien entendu.
       Le texte envoyé est maintenant EXACTEMENT celui qu'on a lu à l'écran. */
    const texte = (acquis + provisoireCourant).trim();

    if (!texte) {
      /* Rien du tout : ce téléphone dit savoir reconnaître le français mais ne
         rend rien. On ne s'entête pas — la prochaine fois, l'enregistrement.
         On n'ouvre pas le micro tout seul pour autant : c'est la règle. */
      telephoneEcouteMal = true;
      etat('Je n’ai pas saisi. Appuie et reparle, j’écoute autrement.');
      relancer();
      return;
    }
    bipCompris();                 // « c'est pris » — avant même de partir
    etat('BIBA réfléchit…', true);
    // « fr » : c'est le français que le téléphone vient de reconnaître.
    recuTexte(texte, 'fr').catch((e) => etat(e.message)).finally(relancer);
  };
  reco.conclureMaintenant = conclure;

  /* Deux délais, et c'est voulu. Le court sert quand le navigateur nous dit
     que la voix s'est arrêtée : on peut conclure vite, il sait. Le long est
     le filet pour les navigateurs qui ne disent rien — mieux vaut attendre
     une seconde de trop que couper quelqu'un au milieu d'un mot. */
  const FILET_MS = 5000;
  /* On a appuyé et il ne se passe rien : ni son, ni mot, ni voix. Inutile de
     laisser le micro ouvert cinq secondes — c'est cinq secondes où l'on croit
     que ça a planté. Deux secondes suffisent pour savoir que personne ne parle.

     Ce délai-là ne s'applique QU'AVANT le premier son. Dès qu'on a entendu
     quelque chose, on repasse au filet large : couper quelqu'un qui parle
     coûte bien plus cher que d'attendre. */
  const RIEN_ENTENDU_MS = 2000;
  let quelqueChoseEntendu = false;

  const relancerLaMinuterie = (delai = FILET_MS) => {
    clearTimeout(minuterie);
    minuterie = setTimeout(() => { if (!voixEnCours) conclure(); }, delai);
  };

  const versLEnregistrement = () => {
    if (fini) return;
    fini = true;
    clearTimeout(minuterie);
    try { reco.stop(); } catch { /* déjà arrêté */ }
    recoEnCours = null;
    ecouter();                       // le chemin d'avant, intact
  };

  micActif(true);
  etat('Je t’écoute…');
  $('entendu').textContent = '';

  /* CE QUI FAISAIT COUPER LA PAROLE.
     Je comptais le silence à partir du dernier MOT RECONNU. Or entre deux
     mots, le navigateur peut rester deux secondes sans rien rendre —
     surtout quand on parle lentement, qu'on cherche ses mots, ou qu'il
     regroupe avant de répondre. Il croyait au silence pendant qu'on parlait
     encore, et coupait au milieu de la phrase.

     Le navigateur sait pourtant écouter le SON, pas seulement les mots :
     « soundstart » quand quelque chose arrive au micro, « speechstart »
     quand il reconnaît une voix, « speechend » quand elle s'arrête. Tant
     qu'une voix porte, on n'a rien à décider — c'est seulement quand elle
     s'arrête vraiment que le compte à rebours commence.

     Le compteur des mots reste, mais en filet large : certains navigateurs
     n'annoncent pas ces événements du tout. */
  let voixEnCours = false;

  reco.onsoundstart = () => { quelqueChoseEntendu = true; clearTimeout(minuterie); };
  reco.onspeechstart = () => { quelqueChoseEntendu = true; voixEnCours = true; clearTimeout(minuterie); };
  /* Combien de mots ont été entendus jusqu'ici : deux mots ne font pas une
     question, et on ne coupe pas quelqu'un qui commence à peine. */
  const attente = () => {
    const dit = (acquis + provisoireCourant).trim();
    const mots = dit ? dit.split(/\s+/).length : 0;
    return mots >= MOTS_POUR_ETRE_SUR ? SILENCE_MS : SILENCE_DEBUT_MS;
  };

  reco.onspeechend = () => {
    // Là, la voix s'est vraiment arrêtée : c'est le bon moment pour compter.
    voixEnCours = false;
    relancerLaMinuterie(attente());
  };
  reco.onsoundend = () => { if (!voixEnCours) relancerLaMinuterie(attente()); };

  reco.onresult = (e) => {
    quelqueChoseEntendu = true;
    let provisoire = '';
    for (let i = e.resultIndex; i < e.results.length; i += 1) {
      const morceau = e.results[i][0].transcript;
      if (e.results[i].isFinal) acquis += morceau + ' ';
      else provisoire += morceau;
    }
    // Les mots s'affichent pendant qu'on parle : c'est ce qui fait qu'on
    // attend sans s'impatienter.
    provisoireCourant = provisoire;
    const enCours = (acquis + provisoire).trim();
    if (enCours) $('entendu').textContent = `« ${enCours} »`;
    relancerLaMinuterie();      // filet large : un mot ne prouve pas la fin
  };

  reco.onerror = (e) => {
    if (e.error === 'aborted' || fini) return;
    if (e.error === 'no-speech') { relancerLaMinuterie(); return; }
    // Refus, langue absente, service indisponible : on reprend le chemin sûr.
    versLEnregistrement();
  };

  /* Le navigateur referme parfois la session tout seul. Tant que la personne
     n'a pas fini, on la rouvre : c'est ce qui permet une phrase longue. */
  reco.onend = () => {
    if (fini) { micActif(false); recoEnCours = null; return; }
    try { reco.start(); } catch { conclure(); }
  };

  try {
    reco.start();
    /* Deux secondes de rien du tout, et on referme — mais seulement si on n'a
       VRAIMENT rien entendu. Certains navigateurs n'annoncent pas le son :
       s'il est arrivé quelque chose entre-temps, on rend la main au filet
       large plutôt que de couper la parole. */
    clearTimeout(minuterie);
    minuterie = setTimeout(() => {
      if (quelqueChoseEntendu || acquis || provisoireCourant) {
        relancerLaMinuterie();
        return;
      }
      conclure();
    }, RIEN_ENTENDU_MS);
  } catch {
    versLEnregistrement();
  }
}

$('micro').onclick = async () => {
  if (recoEnCours) { recoEnCours.conclureMaintenant(); return; }  // second appui
  if (enregistreur) { enregistreur.stop(); return; }   // second appui : on coupe
  arreterLaParole();        // elle parlait : on lui coupe la parole pour écouter
  suspendre();

  /* Le français par le téléphone, quand il sait faire. Le wolof passe par
     l'enregistrement : aucun navigateur ne le reconnaît. Tant qu'on ne sait
     pas encore à qui on parle, on essaie le téléphone — le français est le
     défaut, et s'il se trompe on l'entendra dans ce qui s'affiche. */
  if (RecoNavigateur && !telephoneEcouteMal && langueConversation !== 'wo') {
    return ecouterAvecLeTelephone();
  }
  return ecouter();
};

let ouvertureEnCours = false;
async function ecouter() {
  if (ouvertureEnCours) return;
  const f = format();
  if (f === null) { etat("Ce téléphone ne sait pas enregistrer."); return; }
  ouvertureEnCours = true;
  try {
    flux = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
  } catch {
    ouvertureEnCours = false;
    etat("Le micro n'est pas autorisé sur cet appareil");
    return;
  }
  ouvertureEnCours = false;

  const morceaux = [];
  enregistreur = f ? new MediaRecorder(flux, { mimeType: f }) : new MediaRecorder(flux);
  enregistreur.ondataavailable = (e) => { if (e.data.size) morceaux.push(e.data); };

  const rapport = { analyse: false, parole: 0 };
  const stop = surveiller(flux, () => {
    if (enregistreur && enregistreur.state === 'recording') enregistreur.stop();
  }, rapport);

  const cet = enregistreur;
  enregistreur.onstop = async () => {
    stop();
    flux.getTracks().forEach((t) => t.stop());
    enregistreur = null;
    micActif(false);
    const type = (cet && cet.mimeType) || f || 'audio/mp4';
    const audio = new Blob(morceaux, { type });

    /* On n'envoie pas un enregistrement où personne n'a parlé : le moteur de
       reconnaissance, à qui on tend du silence, invente une phrase — et BIBA
       répondrait très sérieusement à une question que personne n'a posée. */
    if ((rapport.analyse && rapport.parole < 300) || audio.size < 1200) {
      etat('Rien entendu. Appuie et parle.');
      relancer();
      return;
    }
    await envoyer(audio, EXT[String(type).split(';')[0]] || 'm4a');
  };

  enregistreur.start();
  micActif(true);
  etat('Je t’écoute…');
  $('entendu').textContent = '';
}

const AMORCES = [
  /^\s*(je m'?appelle|moi c'?est|mon nom est|c'?est)\s+/i,
  /^\s*(maa ngi tudd|maa ngui tudd|tudd naa|sama tur mooy|sama tur)\s+/i,
];
function extraireNom(dit) {
  let t = String(dit || '').trim().replace(/[.!?]+$/, '');
  for (const a of AMORCES) t = t.replace(a, '');
  const mots = t.split(/\s+/).filter(Boolean).slice(0, 3);
  if (!mots.length) return '';
  return mots.map((m) => m.charAt(0).toUpperCase() + m.slice(1)).join(' ');
}

async function envoyer(audio, extension) {
  etat('BIBA réfléchit…', true);
  try {
    const form = new FormData();
    form.append('audio', audio, `question.${extension}`);
    const r = await fetch(SERVEUR + '/api/entendre', {
      method: 'POST', headers: { 'x-code-acces': code }, body: form,
    });
    const j = await r.json().catch(() => ({}));
    if (j.etat === 'code_epuise' || j.etat === 'code_expire') { await annoncer(j.erreur); return; }
    if (!r.ok) { etat(j.erreur || `Le service a répondu ${r.status}`); return; }
    if (j.etat !== 'ok' || !j.texte) { etat(j.message || 'Rien entendu. Reprends plus près.'); return; }

    await recuTexte(j.texte, j.langue_detectee);
  } catch (e) {
    etat(e.message);
  } finally {
    relancer();
  }
}

/* Ce qui suit ne dépend plus de la FAÇON dont on a entendu : que le texte
   vienne du téléphone, qui écrit pendant qu'on parle, ou du service, qui
   transcrit un enregistrement, la conversation continue pareil. Un seul
   chemin, donc un seul endroit où se tromper. */
async function recuTexte(texte, langueDetectee) {
  $('entendu').textContent = `« ${texte} »`;
  /* La langue se fixe sur la première phrase et tient toute la conversation.
     Tout ce qui n'est pas franchement du wolof est traité comme du français —
     et ce que le téléphone reconnaît, il l'a reconnu en français. */
  if (!langueConversation) langueConversation = langueDetectee === 'wo' ? 'wo' : 'fr';

  if (attendLeNom) {
    const entendu = extraireNom(texte);
    if (!entendu) { await direPhrase('nom_pas_compris'); relancer(); return; }
    let nom = entendu;
    try {
      const p = await appel('/api/prenom', { prenom: entendu });
      if (p && p.prenom) nom = p.prenom;
    } catch { /* le service dort : on garde ce qu'on a entendu */ }
    attendLeNom = false;
    nomActuel = nom;
    $('qui').textContent = `BIBA parle à ${nom}`;
    $('qui').hidden = false;
    await direPhrase('accueil', nom);
    const enAttente = questionEnAttente;
    questionEnAttente = '';
    if (enAttente) { await demander(enAttente); relancer(); return; }
    etat('Appuie pour poser ta question');
    relancer();
    return;
  }

  /* Personne ne s'est encore nommé : avant de répondre, BIBA dit qui elle est
     et demande à qui elle parle. La question attend son tour. */
  if (!nomActuel && phrases.presentation) {
    attendLeNom = true;
    questionEnAttente = motsDe(texte) >= 2 ? texte : '';
    etat('Appuie et dis ton nom');
    await direPhrase('presentation');
    relancer();
    return;
  }

  await demander(texte);
  relancer();
}

async function demander(question) {
  $('mal').hidden = true;
  $('correction').hidden = true;
  $('chrono').textContent = '';
  etat('BIBA réfléchit…', true);
  const depart = Date.now();
  try {
    /* Le texte D'ABORD, la voix ensuite.
       Demander les deux dans le même envoi paraissait plus malin : la voix se
       fabriquait pendant l'attente. Mais elle retardait la réponse entière —
       rien ne s'affichait tant que le dernier octet d'audio n'était pas prêt.
       Mesuré : 8,8 s avant le premier mot à l'écran, contre 2,5 s ici. */
    const r = await appel('/api/assistant', { question, interlocuteur: nomActuel, avec_voix: false });
    dernier = r;
    const enFrancais = r.langue_reponse === 'fr';
    $('reponse').textContent = r.reponse || r.reponse_wo || '(pas de réponse)';
    $('reponse-fr').textContent = enFrancais ? '' : (r.reponse_fr || '');
    $('mal').hidden = enFrancais;

    // Le texte est lu, la personne n'attend plus devant un écran vide.
    // Maintenant seulement, la voix — et en deux morceaux, pour qu'elle
    // commence avant d'être entièrement fabriquée.
    const tTexte = Date.now() - depart;
    await direVite(r.reponse || r.reponse_wo, enFrancais ? 'fr' : 'wo', r.clef_voix);
    /* D'où vient le temps. Le total mesuré ici est celui que la personne
       ressent : il comprend l'aller-retour du réseau, que le serveur ne voit
       pas. La différence entre les deux, c'est le réseau. */
    const t = r.temps || {};
    const s = (ms) => (ms / 1000).toFixed(1);
    $('chrono').textContent = t.total_ms
      ? `texte en ${s(tTexte)} s — réflexion ${s(t.reflexion_ms)} · `
        + `traduction ${s(t.traduction_ms)} · réseau ${s(Math.max(0, tTexte - t.total_ms))}`
        + ` · voix ${s(Date.now() - depart - tTexte)}`
      : `${s(Date.now() - depart)} s`;

    etat('Appuie pour poser une autre question');
  } catch (e) {
    // Le service dit lui-même quand le code est épuisé ou périmé : on le
    // répète à voix haute plutôt que de l'écrire dans un coin.
    if (/questions|nouveau code|expiré/i.test(e.message)) { await annoncer(e.message); return; }
    etat(e.message);
  }
}

/* ── La correction : c'est elle qui fait grandir le lexique ───────────── */
$('mal').onclick = () => {
  if (!dernier || dernier.langue_reponse === 'fr') return;
  $('correction').hidden = false;
  $('juste').value = dernier.reponse_wo || '';
  $('juste').focus();
};

$('envoyer').onclick = async () => {
  const corrigee = $('juste').value.trim();
  if (!dernier || !corrigee) return;
  $('envoyer').disabled = true;
  try {
    await appel('/api/corriger', {
      source: dernier.reponse_fr, proposee: dernier.reponse_wo, corrigee,
      langue_source: 'fr', id_echange: dernier.id_echange, auteur: 'BIBA',
    });
    $('reponse').textContent = corrigee;
    $('correction').hidden = true;
    $('mal').hidden = true;
    etat('Merci — c’est enregistré');
  } catch (e) {
    etat(e.message);
  } finally {
    $('envoyer').disabled = false;
  }
};

/* ── L'entrée ─────────────────────────────────────────────────────────── */
async function ouvrir() {
  $('verrou').style.display = 'none';
  $('appli').hidden = false;
  try {
    const r = await fetch(SERVEUR + '/api/phrases', {
      cache: 'no-store', headers: { 'x-code-acces': code },
    });
    if (r.ok) (await r.json()).forEach((p) => { phrases[p.cle] = p; });
  } catch { /* le service dort : on se présentera plus tard */ }
  etat('Appuie pour parler');
}

/* On dépense un appel gratuit pour vérifier le code avant d'ouvrir : mieux
   vaut refuser tout de suite que laisser quelqu'un parler pour rien. */
async function codeAccepte(propose) {
  const r = await fetch(SERVEUR + '/api/phrases', {
    cache: 'no-store', headers: { 'x-code-acces': propose },
  });
  if (r.ok) return true;
  const j = await r.json().catch(() => ({}));
  if (j.erreur) $('verrou-erreur').textContent = j.erreur;
  return false;
}

async function entrerAvec(propose) {
  code = propose;
  try { localStorage.setItem('biba.code', code); } catch {}
  await ouvrir();
}

/* ── Un code juste ouvre tout seul ─────────────────────────────────────────
   On ne demande pas d'appuyer sur un bouton après avoir tapé la bonne chose.

   Mais on ne peut pas essayer à chaque lettre : le service ferme la porte au
   bout de vingt codes faux, et taper un code de quinze caractères en
   consommerait quinze — la personne serait bloquée avant même d'avoir fini
   d'écrire. On attend donc que la frappe s'arrête, on n'essaie jamais deux
   fois la même chose, et on s'arrête après trois refus : à partir de là c'est
   le bouton qui décide, et le budget d'essais est préservé. */
function essaiAutomatique(champ, verifier, reussi) {
  let minuteur = null;
  const dejaEssaye = new Set();
  let refus = 0;
  champ.addEventListener('input', () => {
    clearTimeout(minuteur);
    const valeur = champ.value.trim();
    if (valeur.length < 4 || refus >= 3 || dejaEssaye.has(valeur)) return;
    minuteur = setTimeout(async () => {
      if (champ.value.trim() !== valeur || dejaEssaye.has(valeur)) return;
      dejaEssaye.add(valeur);
      let bon = false;
      try { bon = await verifier(valeur); } catch { bon = false; }
      if (bon) reussi(valeur); else refus += 1;
    }, 700);
  });
}

essaiAutomatique($('code'), codeAccepte, entrerAvec);

$('entrer').onclick = async () => {
  const propose = $('code').value.trim();
  if (!propose) { $('code').focus(); return; }
  $('entrer').disabled = true;
  $('verrou-erreur').hidden = true;
  try {
    $('verrou-erreur').textContent = 'Code refusé.';
    if (!await codeAccepte(propose)) { $('verrou-erreur').hidden = false; return; }
    await entrerAvec(propose);
  } catch {
    $('verrou-erreur').textContent = 'Pas de connexion. Réessaie.';
    $('verrou-erreur').hidden = false;
  } finally {
    $('entrer').disabled = false;
  }
};

$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('entrer').click(); });

// Un code déjà accepté sur ce téléphone : on entre sans rien redemander.
if (code) ouvrir();
</script>
